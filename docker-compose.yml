version: '3.8'

services:
  api:
    build: ../GameSimulationPlatform
    ports:
      - "${API_PORT:-8002}:8000"
    volumes:
      - ${HOST_PLATFORM_DIR:-../GameSimulationPlatform}:/app
    environment:
      - PYTHONPATH=/app
    stdin_open: true
    tty: true

  web:
    build: ../GameSimulationPlatform/ui
    ports:
      - "${WEB_PORT:-5174}:5173"
    volumes:
      - ${HOST_PLATFORM_DIR:-../GameSimulationPlatform}/ui:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=/api
      - VITE_PROXY_TARGET=http://api:8000
    depends_on:
      - api
